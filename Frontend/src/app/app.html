<div class="fixed bottom-6 right-6 z-[9999] flex flex-row md:flex-col gap-2 bg-white/80 dark:bg-slate-800/80 backdrop-blur-xl p-2 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 transition-all">
    <button (click)="setTheme('light')" 
            [class.bg-blue-100]="themeMode() === 'light'" [class.text-blue-600]="themeMode() === 'light'"
            [class.dark:bg-blue-900]="themeMode() === 'light'" [class.dark:text-blue-400]="themeMode() === 'light'"
            class="text-slate-500 dark:text-slate-400 p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-300" 
            title="Light Mode">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
    </button>
    <button (click)="setTheme('dark')" 
            [class.bg-blue-100]="themeMode() === 'dark'" [class.text-blue-600]="themeMode() === 'dark'"
            [class.dark:bg-blue-900]="themeMode() === 'dark'" [class.dark:text-blue-400]="themeMode() === 'dark'"
            class="text-slate-500 dark:text-slate-400 p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-300" 
            title="Dark Mode">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>
    <button (click)="setTheme('system')" 
            [class.bg-blue-100]="themeMode() === 'system'" [class.text-blue-600]="themeMode() === 'system'"
            [class.dark:bg-blue-900]="themeMode() === 'system'" [class.dark:text-blue-400]="themeMode() === 'system'"
            class="text-slate-500 dark:text-slate-400 p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition-all duration-300" 
            title="System Theme">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
    </button>
</div>
